<text x="44" y="58" font-size="11.5" font-weight="700" fill="#800000" letter-spacing="1.5">TECH CONFIDENCE · BEFORE → AFTER</text>
<text x="44" y="104" font-size="34" font-weight="600" fill="#1A1614" letter-spacing="-0.6">Everything moved up</text>
<text x="44" y="134" font-size="14.5" fill="#55504B">15 students answered before the course and 13 after, 12 of them both times.</text>
<text x="44" y="156" font-size="14.5" fill="#55504B">Confidence rose on all nine tools — and rose most on the three almost nobody had touched.</text>
